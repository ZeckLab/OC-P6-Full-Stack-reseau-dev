<header class="header-desktop">
  <div class="logo">
    <img src="/assets/images/mdd-logo.png" alt="Logo" />
  </div>

  @if (isAuthenticated()) {
    <nav class="desktop-nav">
      <a (click)="logout()" class="logout-link">Se déconnecter</a>
      <a
        routerLink="/articles/feed"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        >Articles</a
      >
      <a
        routerLink="/topics"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        >Thèmes</a
      >
      <a
        class="profile-icon"
        routerLink="/account"
        routerLinkActive="active-profile"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg
          class="profile-icon-svg"
          xmlns="http://www.w3.org/2000/svg"
          width="27"
          height="30"
          viewBox="0 0 27 30"
          fill="none"
        >
          <path
            d="M1 29V25.88c0-1.65.66-3.24 1.83-4.41A6.24 6.24 0 0 1 7.24 19.64h12.47a6.24 6.24 0 0 1 4.41 1.83c1.17 1.17 1.83 2.76 1.83 4.41V29"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M13.47 13.47a6.24 6.24 0 1 1 0-12.47 6.24 6.24 0 0 1 0 12.47Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
    </nav>
  }
</header>
